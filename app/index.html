<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>自治体別 ごみ分別ボックス</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="controls" aria-label="表示設定">
    <div class="control-fields">
      <div class="control-group control-group--mode">
        <label for="lessonModeSelect">授業モード</label>
        <select id="lessonModeSelect" disabled>
          <option value="">読み込み中…</option>
        </select>
      </div>
      <div class="control-group">
        <label for="municipalitySelect">自治体</label>
        <select id="municipalitySelect" disabled>
          <option>読み込み中…</option>
        </select>
      </div>
    </div>
    <button id="presentationButton" type="button" disabled>投影表示</button>
  </header>

  <main class="app-shell">
    <section class="municipality-heading" aria-live="polite">
      <h1 id="municipalityName">自治体を選択してください</h1>
      <p id="statusText">分別区分データを読み込んでいます。</p>
    </section>

    <section id="practicePanel" class="practice-panel" aria-labelledby="practiceTitle" hidden>
      <div class="practice-panel__header">
        <div>
          <p class="practice-kicker">画像仕分け Pilot</p>
          <h2 id="practiceTitle">どの箱？</h2>
        </div>
        <p id="practiceProgress" class="practice-progress"></p>
      </div>

      <div class="practice-stage">
        <div id="itemCard" class="item-card">
          <img id="itemImage" alt="仕分ける品目の画像">
        </div>

        <div class="practice-copy">
          <p id="practiceInstruction">画像を見て、下の分別箱から1つ選んでください。</p>
          <div id="answerFeedback" class="answer-feedback" role="status" aria-live="assertive"></div>
          <button id="nextItemButton" class="next-item-button" type="button" hidden>次の品目</button>
        </div>
      </div>
    </section>

    <p id="practiceUnavailable" class="practice-unavailable" hidden></p>

    <section id="bucketGrid" class="bucket-grid" aria-label="分別区分"></section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
