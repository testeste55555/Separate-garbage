name: TEMP M068 finalize
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply permanent M068 integration patches
        run: |
          python scripts/tmp_fix_m068_builder.py
          python scripts/tmp_patch_m068.py
          python -m py_compile scripts/build_lesson_ready_m068.py
      - name: Build M068 and prove idempotence
        run: |
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/m068-first.diff
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/m068-second.diff
          cmp /tmp/m068-first.diff /tmp/m068-second.diff
      - name: Run required gates
        run: |
          python scripts/validate_lesson_item_set.py
          python scripts/build_lesson_supplemental_scoring.py
          git diff --exit-code -- data/app/lesson_supplemental_item_scoring.csv
          python scripts/validate_lesson_supplemental_scoring.py
          python scripts/red_team_lesson_supplemental_scoring.py
          python scripts/validate_lesson_15_ui.py
          python scripts/red_team_lesson_15_ui.py
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_item_image_mapping_pilot.py
          for f in scripts/red_team_item_image_mapping*.py scripts/validate_*company*.py scripts/red_team_*company*.py scripts/*company*onboarding*.py; do [ -e "$f" ] && python "$f"; done
          node --check app/app.js
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          python scripts/validate_item_image_assets.py
          python scripts/validate_teaching_display_layer.py
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement M068 Kurashiki regional LESSON_READY_10'
          git push origin HEAD:feature/lesson-ready-15-m068
