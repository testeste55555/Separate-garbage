name: TEMP M068 finalize
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply permanent M068 integration patches
        run: |
          python scripts/tmp_fix_m068_builder.py
          python scripts/tmp_patch_m068.py
          python scripts/tmp_patch_m068_image_validator.py
          python scripts/tmp_patch_m068_research.py
          python -m py_compile scripts/build_lesson_ready_m068.py
      - name: Build M068 and prove idempotence
        run: |
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/m068-first.diff
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/m068-second.diff
          cmp /tmp/m068-first.diff /tmp/m068-second.diff
      - name: Run required gates with diagnostic log
        shell: bash
        run: |
          set +e
          LOG=/tmp/m068-gates.log
          STATUS=/tmp/m068-status
          : > "$LOG"
          fail=0
          run() {
            echo "===== $* =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            p=$?
            echo "exit_code=$p" >> "$LOG"
            if [ $p -ne 0 ]; then fail=$p; return $p; fi
            return 0
          }
          run python scripts/validate_lesson_item_set.py || true
          [ $fail -ne 0 ] || run python scripts/build_lesson_supplemental_scoring.py || true
          [ $fail -ne 0 ] || run git diff --exit-code -- data/app/lesson_supplemental_item_scoring.csv || true
          [ $fail -ne 0 ] || run python scripts/validate_lesson_supplemental_scoring.py || true
          [ $fail -ne 0 ] || run python scripts/red_team_lesson_supplemental_scoring.py || true
          [ $fail -ne 0 ] || run python scripts/validate_lesson_15_ui.py || true
          [ $fail -ne 0 ] || run python scripts/red_team_lesson_15_ui.py || true
          [ $fail -ne 0 ] || run python scripts/validate_classroom_pilot_scoring_modes.py || true
          [ $fail -ne 0 ] || run python scripts/red_team_classroom_pilot_scoring_modes.py || true
          [ $fail -ne 0 ] || run python scripts/validate_classroom_pilot_variants.py || true
          [ $fail -ne 0 ] || run python scripts/red_team_classroom_pilot_variants.py || true
          [ $fail -ne 0 ] || run python scripts/validate_item_image_mapping_pilot.py || true
          if [ $fail -eq 0 ]; then
            for f in scripts/red_team_item_image_mapping*.py scripts/validate_*company*.py scripts/red_team_*company*.py scripts/*company*onboarding*.py; do
              [ -e "$f" ] || continue
              run python "$f" || break
            done
          fi
          [ $fail -ne 0 ] || run node --check app/app.js || true
          [ $fail -ne 0 ] || run python scripts/validate_research.py || true
          [ $fail -ne 0 ] || run python scripts/check_next_batch_gate.py || true
          [ $fail -ne 0 ] || run python scripts/validate_item_image_assets.py || true
          [ $fail -ne 0 ] || run python scripts/validate_teaching_display_layer.py || true
          if [ $fail -eq 0 ]; then echo PASS > "$STATUS"; echo ALL_REQUIRED_GATES_PASSED >> "$LOG"; else echo FAIL > "$STATUS"; fi
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m068-finalize-log
          path: |
            /tmp/m068-gates.log
            /tmp/m068-status
      - name: Require all gates
        run: grep -qx PASS /tmp/m068-status
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement M068 Kurashiki regional LESSON_READY_10'
          git push origin HEAD:feature/lesson-ready-15-m068
