name: M055 promotion diagnose
on:
  push:
    branches: [feature/lesson-ready-15-m055]
    paths: ['.github/workflows/m055-promotion-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m055
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Print promoted state and filtered errors
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import validate_lesson_variants as base
          import classroom_pilot_variant_compat as compat
          for mid in ('M098','M099'):
              print(mid, 'promotion_is_complete=', compat.promotion_is_complete(base.ROOT, mid))
          raw=base.validate_records(base.records(), base.ROOT)
          print('raw boundary:', [e for e in raw if 'variant municipality injected' in e or 'canonical 40-item DEFERRED' in e])
          print('filtered boundary:', [e for e in compat.filter_promotion_boundary_errors(raw, base.ROOT) if 'variant municipality injected' in e or 'canonical 40-item DEFERRED' in e])
          PY
