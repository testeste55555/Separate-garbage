name: TEMP patch progressive APP_READY red team

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch_schema_red_team_manual_pairs.py"
      - ".github/workflows/tmp-patch-schema-red-team.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch and verify schema RED TEAM
        run: |
          set -euo pipefail
          python3 scripts/patch_schema_red_team_manual_pairs.py
          python3 scripts/red_team_schema_v12.py
      - name: Commit patched red team
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/red_team_schema_v12.py; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/red_team_schema_v12.py
          git commit -m "Allow manual APP_READY mappings to supersede pair candidates [skip ci]"
          git push origin HEAD:"$TARGET_BRANCH"
