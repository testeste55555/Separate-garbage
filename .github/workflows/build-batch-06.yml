name: Build Batch 06

on:
  push:
    paths:
      - 'scripts/build_batch_06.py'
      - 'scripts/fix_batch06_authenticity.py'
      - 'scripts/red_team_batch_06.py'
      - '.github/workflows/build-batch-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose Batch 07 pipeline
        shell: bash
        run: |
          mkdir -p docs/research
          log=docs/research/batch_07_pipeline_probe.log
          : > "$log"
          set +e
          python3 scripts/validate_research.py --batch batch_07 >> "$log" 2>&1; echo "batch_validate_rc=$?" >> "$log"
          python3 scripts/merge_research.py >> "$log" 2>&1; echo "merge_rc=$?" >> "$log"
          python3 scripts/validate_research.py >> "$log" 2>&1; echo "canonical_validate_rc=$?" >> "$log"
          python3 scripts/red_team_schema_v12.py >> "$log" 2>&1; echo "schema_red_team_rc=$?" >> "$log"
          python3 scripts/red_team_operational_category_semantics.py >> "$log" 2>&1; echo "operational_red_team_rc=$?" >> "$log"
          python3 scripts/red_team_batch_07.py >> "$log" 2>&1; echo "batch07_red_team_rc=$?" >> "$log"
          python3 scripts/check_next_batch_gate.py >> "$log" 2>&1; echo "next_batch_gate_rc=$?" >> "$log"
          set -e
      - name: Commit Batch 07 diagnostic log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/batch_07_pipeline_probe.log
          git commit -m 'Record Batch 07 pipeline diagnostics' || exit 0
          git push
