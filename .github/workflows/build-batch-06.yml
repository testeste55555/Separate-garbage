name: Build Batch 06

on:
  push:
    paths:
      - 'scripts/build_batch_06.py'
      - 'scripts/fix_batch06_authenticity.py'
      - 'scripts/red_team_batch_06.py'
      - '.github/workflows/build-batch-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply NOT_REVIEWED guide URL validation semantics
        run: python3 scripts/patch_not_reviewed_guide_url_validation.py
      - name: Validate Batch 07 and capture result
        shell: bash
        run: |
          mkdir -p docs/research
          set +e
          python3 scripts/validate_research.py --batch batch_07 > docs/research/batch_07_validation_probe.log 2>&1
          rc=$?
          set -e
          echo "validation_rc=$rc" >> docs/research/batch_07_validation_probe.log
          if [ "$rc" -ne 0 ]; then cat docs/research/batch_07_validation_probe.log; exit "$rc"; fi
      - name: Commit validator and validation marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validation_v12.py docs/research/batch_07_validation_probe.log
          git commit -m 'Allow unresolved guide URL and validate Batch 07' || exit 0
          git push
