name: Build Batch 06

on:
  push:
    paths:
      - 'scripts/build_batch_06.py'
      - 'scripts/fix_batch06_authenticity.py'
      - 'scripts/red_team_batch_06.py'
      - '.github/workflows/build-batch-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Batch 07 only
        run: python3 scripts/validate_research.py --batch batch_07
      - name: Commit validation marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/research
          echo 'batch_07_structural_validation=PASS' > docs/research/batch_07_validation_probe.txt
          git add docs/research/batch_07_validation_probe.txt
          git commit -m 'Confirm Batch 07 structural validation' || exit 0
          git push
