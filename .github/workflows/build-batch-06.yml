name: Build Batch 06

on:
  push:
    paths:
      - 'scripts/build_batch_06.py'
      - 'scripts/fix_batch06_authenticity.py'
      - 'scripts/red_team_batch_06.py'
      - '.github/workflows/build-batch-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Batch 07 verified supplement and rebuild
        run: |
          python3 scripts/apply_batch07_supplement.py
          python3 scripts/build_batch_07.py
      - name: Commit completed Batch 07 bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_batch_07.py data/master/02_official_domain_registry.csv data/research/batches/batch_07
          git commit -m 'Complete evidence-backed Batch 07 bundle' || exit 0
          git push
