name: Build Batch 06

on:
  push:
    paths:
      - 'scripts/build_batch_06.py'
      - 'scripts/fix_batch06_authenticity.py'
      - 'scripts/red_team_batch_06.py'
      - '.github/workflows/build-batch-06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Batch 07 validation
        shell: bash
        run: |
          mkdir -p docs/research
          set +e
          python3 scripts/validate_research.py --batch batch_07 > docs/research/batch_07_validation_probe.log 2>&1
          rc=$?
          set -e
          echo "validation_rc=$rc" >> docs/research/batch_07_validation_probe.log
      - name: Commit validation probe log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/batch_07_validation_probe.log
          git commit -m 'Record Batch 07 validation probe' || exit 0
          git push
