name: Build Batch 10

# Production verification trigger after active-target RED TEAM finalization.
on:
  push:
    paths:
      - 'scripts/build_batch_10.py'
      - 'scripts/build_batch_10_active.py'
      - 'scripts/red_team_batch_10.py'
      - 'scripts/apply_app_readiness_m098.py'
      - 'scripts/rebuild_app_readiness_m099.py'
      - 'data/master/05_deferred_municipalities.csv'
      - '.github/workflows/build-batch-10.yml'
  pull_request:
    paths:
      - 'scripts/build_batch_10.py'
      - 'scripts/build_batch_10_active.py'
      - 'scripts/red_team_batch_10.py'
      - 'scripts/apply_app_readiness_m098.py'
      - 'scripts/rebuild_app_readiness_m099.py'
      - 'data/master/05_deferred_municipalities.csv'
      - '.github/workflows/build-batch-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Build, validate and RED TEAM Batch 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_batch_10_active.py
          python3 scripts/validate_research.py --batch batch_10 --next-batch-gate
          python3 scripts/red_team_batch_10.py
      - name: Merge Batch 10 and restore reviewed APP_READY promotions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_research.py
          # The historical Batch 10 builder reconstructs the pre-promotion research
          # bundle. Reapply already-reviewed APP_READY overlays before global gates so
          # a batch verification can never downgrade M094/M095/M104/M105 or the
          # regional M098/M099 promotions.
          python3 scripts/apply_app_readiness_pilot_m094.py
          python3 scripts/apply_app_readiness_pilot_m104.py
          python3 scripts/apply_app_readiness_pilot_m095.py
          python3 scripts/finalize_app_readiness_pilot_m095.py
          python3 scripts/rebuild_app_readiness_m105.py
          python3 scripts/finalize_app_readiness_m105.py
          python3 scripts/repair_m105_canonical_union.py
          python3 scripts/rebuild_app_readiness_m099.py
          python3 scripts/apply_app_readiness_m098.py
      - name: Run global gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_research.py
          python3 scripts/red_team_schema_v12.py
          python3 scripts/red_team_operational_category_semantics.py
          python3 scripts/check_next_batch_gate.py
          set +e
          python3 scripts/validate_research.py --app-readiness-gate
          app_rc=$?
          set -e
          if [ "$app_rc" -ne 2 ]; then
            echo "Expected APP_READINESS_GATE HOLD; got rc=$app_rc"
            exit 1
          fi
          mkdir -p docs/research
          cat > docs/research/batch_10_ci_status.txt <<EOF
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          batch_10_active_municipalities=7
          deferred_municipalities=M100
          promoted_regional_app_ready=M098,M099
          batch_10_structural_validation=PASS
          batch_10_red_team=PASS
          canonical_merge=PASS
          app_ready_promotions_restored=PASS
          canonical_structural_validation=PASS
          schema_v1_2_4_red_team=PASS
          next_batch_gate=PASS
          app_readiness_gate=HOLD
          EOF
      - name: Commit completed Batch 10 data state
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The status timestamp above is an ephemeral CI report and must not create
          # a bot-only follow-up commit. Persist only substantive generated data drift.
          git add data/master/02_official_domain_registry.csv data/master/05_deferred_municipalities.csv data/research/batches/batch_10 data/research/02_categories_master.csv data/research/03_sources_master.csv data/research/04_municipalities_research.csv data/research/05_item_mapping_master.csv data/research/06_qa_log.csv data/research/07_item_mapping_coverage.csv data/research/08_category_review_evidence.csv
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Batch 10 preserving APP_READY promotions'
          git push
