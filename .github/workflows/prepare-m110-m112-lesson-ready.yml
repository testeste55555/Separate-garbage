name: Prepare M110-M112 lesson ready

on:
  push:
    paths:
      - "scripts/prepare_m110_m112_lesson_ready.py"
      - ".github/workflows/prepare-m110-m112-lesson-ready.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize one-shot helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare_m110_m112_lesson_ready.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new = '''    if count < 1:\n        raise RuntimeError(f"{path}: expected at least one match, got {count}: {old[:100]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if old not in text:
              raise SystemExit('prepare helper matcher block not found')
          text = text.replace(old, new, 1)
          marker = '# --- Permanent CI rebuild must include the new generic Batch 11 lesson builder. ---'
          if marker not in text:
              raise SystemExit('workflow patch marker not found')
          text = text.split(marker, 1)[0] + 'print("M110_M112_PERMANENT_PATCH_APPLIED")\n'
          path.write_text(text, encoding='utf-8')
          PY
      - name: Patch permanent generators and validators
        run: python3 scripts/prepare_m110_m112_lesson_ready.py
      - name: Update Batch 11 RED TEAM category boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/red_team_batch_11.py')
          text = path.read_text(encoding='utf-8')
          old = '''    names = {mid: {r["自治体正式名称"] for r in cats if r["municipality_id"] == mid and r.get("rule_status") == "CURRENT"} for mid in TARGETS}\n'''
          new = '''    names = {mid: {r["自治体正式名称"] for r in cats if r["municipality_id"] == mid and r.get("rule_status") == "CURRENT" and r.get("ui_role") != "EXCLUDED_NOTICE"} for mid in TARGETS}\n'''
          if text.count(old) != 1:
              raise SystemExit('Batch 11 RED TEAM names boundary not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Rebuild Batch 11 canonical evidence
        run: |
          set -euo pipefail
          python3 scripts/build_batch_11.py
          python3 scripts/validate_research.py --batch batch_11 --next-batch-gate
          python3 scripts/red_team_batch_11.py
          python3 scripts/merge_research.py
      - name: Migrate reviewed M112 rows to corrected S-M112-02 URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          NEW = 'https://www.akiota.jp/uploaded/attachment/9504.pdf'
          def rewrite(path):
              p = Path(path)
              with p.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f); rows = list(reader); names = reader.fieldnames
              changed = 0
              for row in rows:
                  if row.get('municipality_id') != 'M112':
                      continue
                  if row.get('category_source_id') == 'S-M112-02' and 'category_source_url' in row and row.get('category_source_url') != NEW:
                      row['category_source_url'] = NEW; changed += 1
                  if row.get('item_evidence_source_id') == 'S-M112-02' and 'item_evidence_url' in row and row.get('item_evidence_url') != NEW:
                      row['item_evidence_url'] = NEW; changed += 1
              with p.open('w', encoding='utf-8-sig', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=names, lineterminator='\n'); writer.writeheader(); writer.writerows(rows)
              print(path, 'url_fields_updated=', changed)
          rewrite('data/research/05_item_mapping_master.csv')
          rewrite('data/research/07_item_mapping_coverage.csv')
          PY
      - name: Build and synchronize lesson-ready projections
        run: |
          set -euo pipefail
          python3 scripts/build_lesson_ready_m107_m109.py
          python3 scripts/build_lesson_ready_batch11.py
          python3 scripts/sync_lesson_ready_reviews.py
          python3 scripts/apply_item_image_mapping_pilot_top8.py
      - name: Validate lesson and image scoring
        run: |
          set -euo pipefail
          python3 scripts/validate_lesson_scoring_modes.py
          python3 scripts/red_team_lesson_scoring_modes.py
          python3 scripts/validate_item_image_mapping_pilot.py
          python3 scripts/red_team_item_image_mapping_pilot.py
      - name: Run structural regressions
        run: |
          set -euo pipefail
          python3 scripts/validate_research.py
          python3 scripts/red_team_schema_v12.py
          python3 scripts/red_team_operational_category_semantics.py
          python3 scripts/check_next_batch_gate.py
          python3 scripts/validate_item_image_assets.py
          python3 scripts/validate_teaching_display_layer.py
          node --check app/app.js
          set +e
          python3 scripts/validate_research.py --app-readiness-gate
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "Expected APP_READINESS_GATE HOLD; got $rc"
            exit 1
          fi
      - name: Remove one-shot helper script
        run: rm scripts/prepare_m110_m112_lesson_ready.py
      - name: Commit prepared branch state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/
          git commit -m 'Add M110-M112 LESSON_READY_10 projections'
          git push
