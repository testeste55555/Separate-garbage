name: Build Batch 03

on:
  push:
    paths:
      - 'scripts/build_batch_03.py'
      - 'scripts/resolve_m028_operational.py'
      - 'scripts/patch_operational_category_qa.py'
      - 'scripts/finalize_schema_v124.py'
      - 'scripts/red_team_batch_03.py'
      - 'scripts/red_team_operational_category_semantics.py'
      - 'scripts/red_team_schema_v12.py'
      - '.github/workflows/build-batch-03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resident-facing category policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_operational_category_qa.py
          python3 scripts/resolve_m028_operational.py
          python3 scripts/finalize_schema_v124.py
      - name: Build, validate, merge and RED TEAM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_batch_03.py
          python3 scripts/validate_research.py --batch batch_03 --next-batch-gate
          python3 scripts/merge_research.py
          python3 scripts/validate_research.py
          python3 scripts/red_team_schema_v12.py
          python3 scripts/red_team_batch_03.py
          python3 scripts/red_team_operational_category_semantics.py
          python3 scripts/check_next_batch_gate.py
          mkdir -p docs/research
          cat > docs/research/batch_03_ci_status.txt <<EOF
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          batch_03_structural_validation=PASS
          canonical_structural_validation=PASS
          schema_red_team_legacy=25/25_PASS
          operational_semantics_red_team=1/1_PASS
          schema_v1_2_4_red_team=26/26_PASS
          batch_03_red_team=PASS
          m028_operational_evidence=PASS
          next_batch_gate=PASS
          EOF
      - name: Commit generated research data and policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md scripts/schema_v12.py scripts/build_batch_03.py scripts/red_team_batch_03.py docs data/master/02_official_domain_registry.csv data/research/batches/batch_03 data/research/02_categories_master.csv data/research/03_sources_master.csv data/research/04_municipalities_research.csv data/research/05_item_mapping_master.csv data/research/06_qa_log.csv data/research/07_item_mapping_coverage.csv data/research/08_category_review_evidence.csv
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Schema v1.2.4 resident-facing semantics'
          git push
