name: One-time company onboarding compatibility repair

on:
  push:
    branches: [feature/company-onboarding-18]
    paths:
      - '.github/workflows/_repair-company-onboarding-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'testeste55555/Separate-garbage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: feature/company-onboarding-18
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Repair only confirmed compatibility failures
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json
          from collections import Counter
          root = Path('.')
          mapping = root / 'data/app/company_municipality_mapping.csv'
          raw = mapping.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              mapping.write_bytes(b'\xef\xbb\xbf' + raw)
          p = root / 'scripts/validate_app_readiness_m098.py'
          text = p.read_text(encoding='utf-8')
          old = 'if {r.get("company_id") for r in companies} != EXPECTED_COMPANIES or len(companies) != 3:'
          new = 'if not EXPECTED_COMPANIES.issubset({r.get("company_id") for r in companies}) or len({r.get("site_id") for r in companies}) != len(companies):'
          assert text.count(old) == 1
          text = text.replace(old, new)
          text = text.replace('M098 must keep exactly the three confirmed company mappings', 'M098 must preserve the original three company mappings and unique site IDs')
          p.write_text(text, encoding='utf-8')
          p = root / 'scripts/red_team_app_readiness_m098.py'
          text = p.read_text(encoding='utf-8')
          anchor = '    for label, mutate in tests:\n'
          assert text.count(anchor) == 1
          addition = '''    def added_company_wrong_variant(d):
              for r in d["company"]:
                  if r.get("company_id") == "C024" and r.get("municipality_id") == gate.MID:
                      r["lesson_variant_group_id"] = "LV-M099-01"
          tests.append(("new M098 company routed to wrong variant", added_company_wrong_variant))

'''
          text = text.replace(anchor, addition + anchor)
          p.write_text(text, encoding='utf-8')
          # Permanent exact-scope regression for this onboarding batch.
          test = root / 'scripts/validate_company_onboarding_18.py'
          test.write_text('''from __future__ import annotations
import csv
import hashlib
import json
from collections import Counter
from pathlib import Path
from validate_company_municipality_mapping import validate

ROOT = Path(__file__).resolve().parents[1]
MAPPING = ROOT / "data/app/company_municipality_mapping.csv"
BASELINE_SHA256 = "02180886ff89be6faee73c54e2902e0e8d7e99f5dc5f84ce745a7eddf78caa4e"
APP_READY = {"M009", "M020", "M094", "M095", "M098", "M099", "M104", "M105"}


def check():
    with MAPPING.open(encoding="utf-8-sig", newline="") as handle:
        rows = list(csv.DictReader(handle))
    legacy = [r for r in rows if r["company_id"] in {f"C{i:03d}" for i in range(1, 12)}]
    digest = hashlib.sha256(json.dumps(legacy, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode()).hexdigest()
    assert digest == BASELINE_SHA256, "existing 11 company records changed"
    assert len(rows) == 46
    assert len({r["site_id"] for r in rows}) == 46
    assert {r["company_id"] for r in rows} == {f"C{i:03d}" for i in range(1, 30)}
    added = [r for r in rows if int(r["company_id"][1:]) >= 12]
    assert len(added) == 35
    assert len({r["company_id"] for r in added}) == 18
    assert Counter(r["active"] for r in added) == {"TRUE": 15, "FALSE": 20}
    assert all((r["active"] == "TRUE") == (r["municipality_id"] in APP_READY) for r in added)
    assert all(r["mapping_status"] == "CONFIRMED" for r in added)
    assert all(r["lesson_variant_group_id"] == "LV-M098-01" for r in added if r["municipality_id"] == "M098")
    assert all(not r["lesson_variant_group_id"] for r in added if r["municipality_id"] == "M099")
    assert not validate(), "company mapping validation failed"
    print("COMPANY_ONBOARDING_18_VALIDATION_PASSED companies=29 sites=46 added=18/35 active=15 pending=20")


if __name__ == "__main__":
    check()
''', encoding='utf-8')
          p = root / '.github/workflows/company-selector.yml'
          text = p.read_text(encoding='utf-8')
          text = text.replace('      - "scripts/validate_company_municipality_mapping.py"', '      - "scripts/validate_company_municipality_mapping.py"\n      - "scripts/validate_company_onboarding_18.py"')
          anchor = '      - name: Mutation RED TEAM\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '      - name: Validate 18-company onboarding\n        run: python scripts/validate_company_onboarding_18.py\n' + anchor)
          p.write_text(text, encoding='utf-8')
          # Keep the one-off delivery mechanism out of the final repository.
          (root / '.github/workflows/_repair-company-onboarding-once.yml').unlink()
          print('COMPATIBILITY_REPAIR_PREPARED')
          PY
      - name: Verify mapping and legacy regressions
        run: |
          python scripts/validate_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_app_readiness_m098.py
          python scripts/red_team_app_readiness_m098.py
          python - <<'PY'
          from pathlib import Path
          import ast
          for path in [Path('scripts/validate_app_readiness_m098.py'), Path('scripts/red_team_app_readiness_m098.py'), Path('scripts/validate_company_onboarding_18.py')]:
              ast.parse(path.read_text(encoding='utf-8'))
          print('PYTHON_SYNTAX_PASSED')
          PY
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/app/company_municipality_mapping.csv scripts/validate_app_readiness_m098.py scripts/red_team_app_readiness_m098.py scripts/validate_company_onboarding_18.py .github/workflows/company-selector.yml
          git add -u .github/workflows/_repair-company-onboarding-once.yml
          git diff --cached --check
          git commit -m 'Keep original routing assertions and validate expanded company registry'
          git push origin HEAD:feature/company-onboarding-18
