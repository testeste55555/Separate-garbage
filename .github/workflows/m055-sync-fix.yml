name: M055 sync fix
on:
  push:
    branches: [feature/lesson-ready-15-m055]
    paths: ['.github/workflows/m055-sync-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m055
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch generic lesson synchronizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync_lesson_ready_reviews.py')
          s=p.read_text(encoding='utf-8')
          if 'VARIANT_ONLY_LESSON_READY = {"M055"}' not in s:
              s=s.replace('LESSON_STATUS = "LESSON_READY_10"\n', 'LESSON_STATUS = "LESSON_READY_10"\nVARIANT_ONLY_LESSON_READY = {"M055"}\n')
          old='''    image_fields, image_rows = read_csv(IMAGE_MAPPING_PATH)\n    scoring_branch_by_pair: dict[tuple[str, str], dict[str, str]] = {}\n    for pair, review_rows in review_by_pair.items():\n        scoring = [row for row in review_rows if row.get("scoring_branch") == "TRUE"]\n        if len(scoring) != 1:\n            raise ValueError(f"{pair} must have exactly one scoring branch")\n        scoring_branch_by_pair[pair] = scoring[0]\n'''
          new='''    image_fields, image_rows = read_csv(IMAGE_MAPPING_PATH)\n    image_rows = [row for row in image_rows if row.get("municipality_id") not in VARIANT_ONLY_LESSON_READY]\n    scoring_branch_by_pair: dict[tuple[str, str], dict[str, str]] = {}\n    for pair, review_rows in review_by_pair.items():\n        scoring = [row for row in review_rows if row.get("scoring_branch") == "TRUE"]\n        if pair[0] in VARIANT_ONLY_LESSON_READY:\n            if scoring or any(row.get("scoring_branch") != "FALSE" for row in review_rows):\n                raise ValueError(f"{pair} variant-only review must not define a municipality-wide scoring branch")\n            continue\n        if len(scoring) != 1:\n            raise ValueError(f"{pair} must have exactly one scoring branch")\n        scoring_branch_by_pair[pair] = scoring[0]\n'''
          if old not in s: raise SystemExit('lesson sync scoring block not found')
          s=s.replace(old,new)
          for token in ['VARIANT_ONLY_LESSON_READY = {"M055"}', 'variant-only review must not define']:
              if token not in s: raise SystemExit(f'missing {token}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronizer contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync_lesson_ready_reviews.py
          git commit -m 'Preserve variant-only M055 through lesson synchronization'
          git push origin HEAD:feature/lesson-ready-15-m055
      - name: Validate synchronization and all remaining gates
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m055.py
          python scripts/sync_lesson_ready_reviews.py
          python scripts/build_lesson_ready_m055.py
          git diff --exit-code -- \
            data/app/item_image_mapping_pilot_top8.csv \
            data/research/05_item_mapping_master.csv \
            data/research/07_item_mapping_coverage.csv
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
          python scripts/validate_company_municipality_mapping.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          python scripts/rebuild_lesson_ready_regional_preserve_app_ready.py
          git diff --exit-code -- \
            data/app/district_scopes.csv \
            data/app/lesson_variant_groups.csv \
            data/app/lesson_variant_item_scoring.csv \
            data/app/lesson_variant_teaching_boxes.csv \
            data/research/lesson_readiness/lesson_variant_sources.csv \
            data/master/07_implementation_priority.csv
          node --check app/app.js
