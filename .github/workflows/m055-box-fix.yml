name: M055 box fix
on:
  push:
    branches: [feature/lesson-ready-15-m055]
    paths: ['.github/workflows/m055-box-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m055
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Align in-person boxes to the fixed10 answer set
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_lesson_ready_m055.py')
          s=p.read_text(encoding='utf-8')
          old='''        for order, cid in enumerate(["C-M055-01","C-M055-02","C-M055-03","C-M055-04","C-M055-05","C-M055-06","C-M055-08","C-M055-09"], 1):\n            label = next(r["自治体正式名称"] for r in read_csv(CATEGORIES)[1] if r.get("municipality_id") == MID and r.get("category_id") == cid)\n            box_rows.append({"lesson_variant_group_id": gid, "teaching_box_id": f"TB-{gid.replace('LV-', '')}-IP-{order:02d}", "class_mode": "IN_PERSON_CLASS", "box_kind": "MAJOR_CATEGORY", "display_name": label, "display_order": str(order), "note": "対面授業用の主要分別箱", "style_source_category_ids": cid, "style_district_scope": "MUNICIPALITY_WIDE"})\n'''
          new='''        for order, (cid, label) in enumerate(unique, 1):\n            box_rows.append({"lesson_variant_group_id": gid, "teaching_box_id": f"TB-{gid.replace('LV-', '')}-IP-{order:02d}", "class_mode": "IN_PERSON_CLASS", "box_kind": "MAJOR_CATEGORY", "display_name": label, "display_order": str(order), "note": "対面授業用の主要分別箱。固定10で実際に使う区分のみ表示。", "style_source_category_ids": cid, "style_district_scope": "MUNICIPALITY_WIDE"})\n'''
          if old not in s: raise SystemExit('M055 in-person box block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
          python scripts/build_lesson_ready_m055.py
      - name: Commit M055 box normalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_lesson_ready_m055.py data/app/lesson_variant_teaching_boxes.csv
          git commit -m 'Align M055 in-person boxes with regional fixed10 answers'
          git push origin HEAD:feature/lesson-ready-15-m055
      - name: Check regional variant validator
        run: python scripts/validate_classroom_pilot_variants.py
