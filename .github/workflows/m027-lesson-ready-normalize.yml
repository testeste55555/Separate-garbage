name: M027 LESSON_READY normalize

on:
  push:
    branches:
      - feature/lesson-ready-15-m027
    paths:
      - '.github/workflows/m027-lesson-ready-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: feature/lesson-ready-15-m027
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'
      - name: Build M027 and synchronize reviewed fixed ten
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m027.py
          python scripts/sync_lesson_ready_reviews.py
      - name: Commit generated M027 state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/research/03_sources_master.csv \
            data/research/batches/batch_03/batch_03_sources.csv \
            data/research/05_item_mapping_master.csv \
            data/research/07_item_mapping_coverage.csv \
            data/app/lesson_mode_app_ready_scope.csv \
            data/app/lesson_teaching_boxes.csv \
            data/app/lesson_item_scoring_projection.csv \
            data/app/item_image_mapping_pilot_top8.csv \
            data/app/company_municipality_mapping.csv \
            data/master/07_implementation_priority.csv
          if git diff --cached --quiet; then
            echo 'No generated M027 state changes.'
          else
            git commit -m 'Refresh M027 generated state'
            git push origin HEAD:feature/lesson-ready-15-m027
          fi
      - name: Validate formal lesson item set
        run: python scripts/validate_lesson_item_set.py
      - name: Validate scoring modes
        run: python scripts/validate_classroom_pilot_scoring_modes.py
      - name: RED TEAM scoring modes
        run: python scripts/red_team_classroom_pilot_scoring_modes.py
      - name: Validate company mapping
        run: python scripts/validate_company_municipality_mapping.py
      - name: RED TEAM company mapping
        run: python scripts/red_team_company_municipality_mapping.py
      - name: Validate company onboarding readiness sync
        run: python scripts/validate_company_onboarding_18.py
      - name: Validate regional variants
        run: python scripts/validate_classroom_pilot_variants.py
      - name: RED TEAM regional variants
        run: python scripts/red_team_classroom_pilot_variants.py
      - name: Validate item image mapping
        run: python scripts/validate_item_image_mapping_pilot.py
      - name: RED TEAM item image mapping
        run: python scripts/red_team_item_image_mapping_pilot.py
      - name: Capture canonical research diagnostic
        run: python scripts/validate_research.py > m027_research_diagnostic.txt 2>&1 || true
      - name: Save canonical research diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add m027_research_diagnostic.txt
          git commit -m 'Capture M027 canonical research diagnostic'
          git push origin HEAD:feature/lesson-ready-15-m027
      - name: Check canonical next-batch gate
        run: python scripts/check_next_batch_gate.py
      - name: Check learner UI JavaScript syntax
        run: node --check app/app.js
