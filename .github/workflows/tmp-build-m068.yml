name: TEMP M068 build
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch variant contracts and permanent CI
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s and new not in s: raise SystemExit(f'missing patch anchor: {path}: {old}')
              if old in s: s=s.replace(old,new)
              p.write_text(s)
          patch('scripts/sync_lesson_ready_reviews.py','VARIANT_ONLY_LESSON_READY = {"M055"}','VARIANT_ONLY_LESSON_READY = {"M055", "M068"}')
          patch('scripts/validate_lesson_scoring_modes.py','VARIANT_ONLY_LESSON_READY = {"M055"}','VARIANT_ONLY_LESSON_READY = {"M055", "M068"}')
          patch('scripts/validate_lesson_scoring_modes.py','"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M050": LESSON_READY, "M055": LESSON_READY, "M056": LESSON_READY, "M067": LESSON_READY, "M097": LESSON_READY,','"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M050": LESSON_READY, "M055": LESSON_READY, "M056": LESSON_READY, "M067": LESSON_READY, "M068": LESSON_READY, "M097": LESSON_READY,')
          p='scripts/validate_lesson_variants.py'
          patch(p,'TARGETS = {"M055", "M076",','TARGETS = {"M055", "M068", "M076",')
          patch(p,'STANDARD_SCOPE_VARIANT_TARGETS = {"M055"}','STANDARD_SCOPE_VARIANT_TARGETS = {"M055", "M068"}')
          patch(p,'    "M055": {"LV-M055-01", "LV-M055-02"},','    "M055": {"LV-M055-01", "LV-M055-02"},\n    "M068": {"LV-M068-01", "LV-M068-02"},')
          patch(p,'    "M055": "TRUE",','    "M055": "TRUE", "M068": "TRUE",')
          patch(p,'    "M055": {"LV-M055-01": 4, "LV-M055-02": 2},','    "M055": {"LV-M055-01": 4, "LV-M055-02": 2},\n    "M068": {"LV-M068-01": 1, "LV-M068-02": 1},')
          anchor='NEW_EXPECTED_LABELS = {\n'
          addition='    "LV-M068-01": ["資源ごみ", "資源ごみ", "資源ごみ", "燃やせるごみ", "資源ごみ", "資源ごみ", "資源ごみ", "使用済み乾電池", "埋立ごみ", "燃やせるごみ"],\n    "LV-M068-02": ["資源ごみ", "資源ごみ", "資源ごみ", "資源ごみ", "資源ごみ", "資源ごみ", "資源ごみ", "体温計・乾電池", "燃えないごみ", "燃えるごみ"],\n'
          s=Path(p).read_text()
          if '"LV-M068-01"' not in s[s.index('NEW_EXPECTED_LABELS'):]: s=s.replace(anchor,anchor+addition)
          Path(p).write_text(s)
          w='.github/workflows/app-ready-lesson-modes.yml'
          patch(w,'      - "scripts/build_lesson_ready_m067.py"','      - "scripts/build_lesson_ready_m067.py"\n      - "scripts/build_lesson_ready_m068.py"')
          # second identical trigger occurrence
          s=Path(w).read_text(); old='      - "scripts/build_lesson_ready_m067.py"\n      - "scripts/build_lesson_ready_m068.py"';
          if s.count('      - "scripts/build_lesson_ready_m068.py"') < 2:
              idx=s.find('      - "scripts/build_lesson_ready_m067.py"', s.find(old)+len(old));
              if idx>=0: s=s[:idx]+s[idx:].replace('      - "scripts/build_lesson_ready_m067.py"','      - "scripts/build_lesson_ready_m067.py"\n      - "scripts/build_lesson_ready_m068.py"',1)
          if '          python scripts/build_lesson_ready_m068.py' not in s:
              s=s.replace('          python scripts/build_lesson_ready_m067.py','          python scripts/build_lesson_ready_m067.py\n          python scripts/build_lesson_ready_m068.py')
          for name in ['batch_07_categories.csv','batch_07_category_review_evidence.csv','batch_07_item_mapping.csv','batch_07_item_coverage.csv']:
              line=f'            data/research/batches/batch_07/{name} \\\n'
              if f'data/research/batches/batch_07/{name}' not in s:
                  s=s.replace('            data/research/batches/batch_07/batch_07_sources.csv \\\n', line+'            data/research/batches/batch_07/batch_07_sources.csv \\\n')
          Path(w).write_text(s)
          PY
      - name: Build M068 and prove idempotence
        run: |
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/first.diff
          python scripts/build_lesson_ready_m068.py
          python scripts/sync_lesson_ready_reviews.py
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
      - name: Run full gates
        run: |
          python scripts/validate_lesson_item_set.py
          python scripts/build_lesson_supplemental_scoring.py
          python scripts/validate_lesson_supplemental_scoring.py
          python scripts/red_team_lesson_supplemental_scoring.py
          python scripts/validate_lesson_15_ui.py
          python scripts/red_team_lesson_15_ui.py
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_item_image_mapping_pilot.py
          for f in scripts/red_team_item_image_mapping*.py scripts/validate_*company*.py scripts/red_team_*company*.py scripts/*company*onboarding*.py; do [ -e "$f" ] && python "$f"; done
          node --check app/app.js
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          python scripts/validate_item_image_assets.py
          python scripts/validate_teaching_display_layer.py
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement M068 Kurashiki regional LESSON_READY_10'
          git push origin HEAD:feature/lesson-ready-15-m068
