name: Resolve M028 by resident-facing operational evidence

on:
  push:
    paths:
      - '.github/workflows/resolve-m028-operational.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch M028 evidence semantics and RED TEAM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/build_batch_03.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'M028 (Yura Town) is kept NOT_REVIEWED/QA_REQUIRED because\n'
              'the current official web material available to this research pass confirms the\n'
              'calendar labels but not a complete all-category index.\n',
              'M028 (Yura Town) uses the municipality\'s resident-facing official sorting page as\n'
              'the category index and the 2026 municipal calendar as independent current-operation\n'
              'evidence. Treatment-plan material streams are not promoted to learner SORT_BUCKETs.\n'
          )

          old = '''    "M028": dict(pref="和歌山県", city="由良町", impl="個別指定", processor="由良町",
              top="https://www.town.yura.wakayama.jp/",
              guide="https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf",
              search="", year="令和8年度", note="2026年3月公式広報で可燃・プラスチック・不燃・資源・粗大を確認。全区分索引は未確認のためQA_REQUIRED", review=False),'''
          new = '''    "M028": dict(pref="和歌山県", city="由良町", impl="個別指定", processor="由良町",
              top="https://www.town.yura.wakayama.jp/",
              guide="https://www.town.yura.wakayama.jp/docs/2014011700505/",
              search="", year="令和8年度", note="町公式の住民向け分別案内を分類体系の主根拠とし、2026年3月公式広報カレンダーで同区分の現行運用を確認", review=True),'''
          assert old in s
          s = s.replace(old, new)

          old = '''    "M028": [
              ("広報ゆら 2026年3月号", "自治体公式PDF", "https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf", "2026-03", "現行カレンダー上の可燃・プラスチック・不燃・資源・粗大のラベル"),
              ("由良町公式ホームページ", "自治体公式Webページ", "https://www.town.yura.wakayama.jp/", "2026", "生活環境・ごみリサイクル公式導線"),
          ],'''
          new = '''    "M028": [
              ("由良町 住民向けごみ分別案内", "自治体公式Webページ", "https://www.town.yura.wakayama.jp/docs/2014011700505/", "2014-01-17", "住民が排出時に選択する可燃・プラスチック・不燃・資源・粗大の公式分別区分"),
              ("広報ゆら 2026年3月号", "自治体公式PDF", "https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf", "2026-03", "2026年現在も同じ住民向け分別区分で収集が稼働していることの現行性確認"),
          ],'''
          assert old in s
          s = s.replace(old, new)

          old = '''# M028 由良町：現行公式広報で確認できるラベルのみ。網羅性はNOT_REVIEWED。
          add("M028", "可燃ごみ", NOT_STATED, locator="広報ゆら2026年3月号カレンダー／可燃1・可燃2")
          add("M028", "プラスチック", NOT_STATED, locator="広報ゆら2026年3月号カレンダー／プラスチック")
          add("M028", "不燃ごみ", NOT_STATED, locator="広報ゆら2026年3月号カレンダー／不燃")
          add("M028", "資源ごみ", NOT_STATED, locator="広報ゆら2026年3月号カレンダー／資源1・資源2")
          add("M028", "粗大ごみ", NOT_STATED, locator="広報ゆら2026年3月号カレンダー／粗大ごみ", ui="REFERENCE_ONLY", bulky="TRUE")'''
          new = '''# M028 由良町：町公式の住民向け分別案内を主根拠、2026年カレンダーを現行性証拠とする。
          # 可燃1/2・資源1/2は地区別収集グループであり、住民の分別先は可燃ごみ・資源ごみの各1区分。
          add("M028", "可燃ごみ", NOT_STATED, locator="住民向けごみ分別案内／可燃ごみ")
          add("M028", "プラスチック", NOT_STATED, locator="住民向けごみ分別案内／プラスチック")
          add("M028", "不燃ごみ", NOT_STATED, locator="住民向けごみ分別案内／不燃ごみ")
          add("M028", "資源ごみ", NOT_STATED, locator="住民向けごみ分別案内／資源ごみ")
          add("M028", "粗大ごみ", NOT_STATED, locator="住民向けごみ分別案内／粗大ごみ", ui="REFERENCE_ONLY", bulky="TRUE")'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/red_team_batch_03.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'This report intentionally expects Yura Town (M028) to remain QA_REQUIRED until a\n'
              'complete current official category index is obtained. The point is to prevent the\n'
              'pipeline from converting an evidence gap into a false QA pass.\n',
              'This report verifies Yura Town (M028) with a resident-facing official category page\n'
              'plus a current municipal calendar. It also verifies that treatment-plan streams do\n'
              'not redefine the learner-facing sorting buckets.\n'
          )
          s = s.replace('REVIEWED = TARGETS - {"M028"}', 'REVIEWED = TARGETS')
          s = s.replace(
              '    _, qa = read_csv(p["qa_path"])\n    _, evidence = read_csv(p["review_evidence_path"])',
              '    _, qa = read_csv(p["qa_path"])\n    _, sources = read_csv(p["source_path"])\n    _, evidence = read_csv(p["review_evidence_path"])'
          )
          s = s.replace('"nine reviewed municipalities pass QA"', '"all ten reviewed municipalities pass QA"')
          old = '''    checks.append(("Yura evidence gap remains explicit", (
              by_mid["M028"]["category_count_check_status"] == "NOT_REVIEWED"
              and by_mid["M028"]["category_count_verified"] == "FALSE"
              and qa_by_mid["M028"]["確認ステータス"] == "QA_REQUIRED"
              and evidence_count["M028"] == 0
          ), "M028 must not be auto-promoted"))'''
          new = '''    yura_urls = {row["公式URL"] for row in sources if row["municipality_id"] == "M028"}
          checks.append(("Yura uses resident-facing classification plus current-operation evidence", (
              by_mid["M028"]["category_count_check_status"] == "MANUAL_INDEX_REVIEW"
              and by_mid["M028"]["category_count_verified"] == "TRUE"
              and qa_by_mid["M028"]["確認ステータス"] == "QA_PASSED"
              and evidence_count["M028"] >= 2
              and by_mid["M028"]["reviewed_category_count"] == "5"
              and "https://www.town.yura.wakayama.jp/docs/2014011700505/" in yura_urls
              and "https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf" in yura_urls
          ), "resident-facing source + 2026 calendar must both be retained"))'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('BATCH03_RED_TEAM_PASSED_WITH_M028_EVIDENCE_HOLD', 'BATCH03_RED_TEAM_PASSED')
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- QA：34 `QA_PASSED` / 1 `QA_REQUIRED`', '- QA：35 `QA_PASSED` / 0 `QA_REQUIRED`')
          s = s.replace('- `M028 由良町`：現行公式広報で可燃・プラスチック・不燃・資源・粗大のラベルは確認済み。ただし全区分索引を確認できていないため `NOT_REVIEWED / QA_REQUIRED`', '- `M028 由良町`：町公式の住民向け分別案内を分類体系の主根拠とし、2026年公式広報カレンダーで同区分の現行運用を確認。`MANUAL_INDEX_REVIEW / QA_PASSED`')
          s = s.replace('- category review evidence：72行', '- category review evidence：74行')
          s = s.replace('- Batch 03専用RED TEAM：由良町の証拠不足を自動昇格させない検査を追加', '- Batch 03専用RED TEAM：由良町について住民向け公式区分＋2026年現行運用証拠の併用を検査')
          s = s.replace('- `NEXT_BATCH_GATE`：`HOLD`（M028の区分網羅性証拠待ち）', '- `NEXT_BATCH_GATE`：`PASS`')
          s = s.replace('由良町については証拠不足を汎用文や推測で補わず、Gateを意図的にHOLDにしています。', '由良町は、住民向け公式分別ページを分類体系、2026年公式広報を現行性の補強証拠として採用しています。処理計画上の資源フローをそのまま学習者用分別箱へ昇格させません。')
          s = s.replace('`data/research/batches/batch_03/`：Batch 03 10自治体（M028のみQA_REQUIRED）', '`data/research/batches/batch_03/`：Batch 03 10自治体（全10 QA_PASSED）')
          s = s.replace('python3 scripts/check_next_batch_gate.py  # M028未解消中はHOLD（終了コード2）', 'python3 scripts/check_next_batch_gate.py  # 現状PASS（終了コード0）')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild, validate, merge and RED TEAM
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_batch_03.py
          python3 scripts/validate_research.py --batch batch_03 --next-batch-gate
          python3 scripts/merge_research.py
          python3 scripts/validate_research.py
          python3 scripts/red_team_schema_v12.py
          python3 scripts/red_team_batch_03.py
          python3 scripts/check_next_batch_gate.py

      - name: Persist policy and verification records
        shell: bash
        run: |
          mkdir -p docs/research docs/workflow
          cat > docs/research/m028_yura_operational_resolution_2026-08-19.md <<'EOF'
          # M028 由良町 住民向け現行区分による解消

          実施日: 2026-08-19

          ## 判定

          M028を `MANUAL_INDEX_REVIEW / QA_PASSED` へ変更する。

          ## 根拠モデル

          本アプリのcategory completenessは、処理施設・資源化計画上の物質フローを網羅することではなく、住民が家庭ごみを排出するときに選択する自治体公式の分別区分を網羅することを目的とする。

          由良町では次の2資料を組み合わせる。

          1. 由良町公式 住民向けごみ分別案内
             - https://www.town.yura.wakayama.jp/docs/2014011700505/
             - 役割: PRIMARY_INDEX
             - 住民向け分別区分: 可燃ごみ / プラスチック / 不燃ごみ / 資源ごみ / 粗大ごみ
          2. 由良町公式「広報ゆら 2026年3月号」
             - https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf
             - 役割: SUPPLEMENTAL_INDEX / current-operation evidence
             - 2026年現在も可燃1/2、プラスチック、不燃、資源1/2、粗大ごみの収集が実運用されていることを確認する。

          可燃1/2・資源1/2は地区別の収集グループ差であり、分別先そのものを2区分へ分けない。

          ## 環境省地域計画との関係

          環境省地域計画にペットボトル・乾電池・古紙等の個別資源フローが記載されていても、それだけを根拠に学習者用SORT_BUCKETへ独立昇格させない。住民向け公式案内で資源ごみ等の内部品目として運用されるものは、住民の実際の排出判断に合わせる。

          ## 一般化ルール

          更新日の古い自治体公式ページでも、現在も公式公開され、現年度のカレンダー・広報・収集案内等が同じ区分体系の稼働を裏付ける場合は、PRIMARY_INDEXとして利用できる。

          `publication age != rule retirement` とし、現行性は別の公式current-operation evidenceで確認する。
          EOF

          cat > docs/workflow/WORK_ゴミ出し情報収集フロー_143自治体_v1.12.txt <<'EOF'
          WORK ゴミ出し情報収集フロー 143自治体 v1.12
          制定日: 2026-08-19
          適用Schema: v1.2.3

          1. category completenessの基準
          - 住民が家庭ごみを排出する際に選択する自治体公式の分別区分を網羅する。
          - 処理計画・資源化計画・施設内処理フローの全系列を、そのまま住民向け分別区分とはみなさない。
          - 品目別・資源化上の下位系列は、住民向け公式案内で独立分別先になっている場合のみ独立categoryとする。

          2. 古い公開ページの現行性
          - 公式ページの公開・更新日が古いことだけを理由にRETIRED扱いしない。
          - 現在も自治体公式サイトから公開されており、現年度のカレンダー・広報・収集案内などが同じ区分の運用を示す場合、公式ページをPRIMARY_INDEXとして利用できる。
          - 現年度資料をSUPPLEMENTAL_INDEX / current-operation evidenceとして保持する。
          - publication age と rule status を分離する。

          3. 由良町 M028
          - PRIMARY_INDEX: https://www.town.yura.wakayama.jp/docs/2014011700505/
          - current-operation evidence: https://www.town.yura.wakayama.jp/docs/2025122500014/files/202603.pdf
          - 採用区分: 可燃ごみ / プラスチック / 不燃ごみ / 資源ごみ / 粗大ごみ
          - 可燃1/2・資源1/2は地区グループ差として扱い、分別categoryを二重化しない。
          - MANUAL_INDEX_REVIEW / QA_PASSED

          4. Gate
          - Batch 03: 10 QA_PASSED / 0 QA_REQUIRED
          - NEXT_BATCH_GATE: PASS
          - APP_READINESS_GATE: HOLD（40品目の品目別公式確認未完了）
          - Batch 04開始可
          EOF

          cat > docs/research/batch_03_ci_status.txt <<'EOF'
          verified_at_utc=2026-08-19
          batch_03_structural_validation=PASS
          canonical_structural_validation=PASS
          schema_red_team=PASS
          batch_03_red_team=PASS
          m028_operational_evidence=PASS
          next_batch_gate=PASS
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/workflow/README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- `WORK_ゴミ出し情報収集フロー_143自治体_v1.11.txt`：**現行版**。Batch 03と証拠不足時の`NOT_REVIEWED / QA_REQUIRED`保持を追加', '- `WORK_ゴミ出し情報収集フロー_143自治体_v1.11.txt`：Batch 03証拠不足HOLD時の履歴版\n- `WORK_ゴミ出し情報収集フロー_143自治体_v1.12.txt`：**現行版**。住民向け運用区分をcategory completenessの基準とし、古い公式ページ＋現年度運用証拠の併用を追加')
          old = 'v1.11では、公式全区分体系の証拠を取得できない自治体を推測で`QA_PASSED`へ昇格させません。Batch 03は10自治体を研究bundleとして統合し、M023・M024・M025・M026・M027・M029・M031・M032・M033の9自治体は`QA_PASSED`、M028由良町は全区分索引の現行一次資料が未取得のため`NOT_REVIEWED / QA_REQUIRED`です。\n\n現状は構造validation・Schema RED TEAM・Batch 03 RED TEAMがPASS、`NEXT_BATCH_GATE=HOLD`、`APP_READINESS_GATE=HOLD`です。由良町の網羅性証拠を解消するまでBatch 04へ進みません。'
          new = 'v1.12では、category completenessを「住民が排出時に選択する公式分別区分の網羅」と定義します。由良町は町公式の住民向け分別案内をPRIMARY_INDEX、2026年広報カレンダーをcurrent-operation evidenceとして採用し、5区分を`MANUAL_INDEX_REVIEW / QA_PASSED`としました。処理計画上のPET・乾電池等の資源フローは、それだけを理由に独立SORT_BUCKETへ昇格させません。\n\n現状はBatch 03全10自治体QA_PASSED、構造validation・Schema RED TEAM・Batch 03 RED TEAM・`NEXT_BATCH_GATE`がPASS、`APP_READINESS_GATE`はHOLDです。Batch 04開始可です。'
          assert old in s
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_batch_03.py scripts/red_team_batch_03.py README.md docs data/master/02_official_domain_registry.csv data/research
          git commit -m 'Resolve Yura with resident-facing operational evidence'
          git push
