name: M050 style normalize

on:
  push:
    branches:
      - feature/lesson-ready-15-m050
    paths:
      - '.github/workflows/m050-style-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m050
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Normalize SIMPLIFIED_ACTION style metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_lesson_ready_m050.py')
          text = path.read_text(encoding='utf-8')
          old = '"style_source_category_ids": cid, "style_district_scope": "MUNICIPALITY_WIDE",\n        })\n    for order, (cid, label) in enumerate(IN_PERSON_SPEC, 1):'
          new = '"style_source_category_ids": cid if kind == "FIXED_10_SCORING" else "",\n            "style_district_scope": "MUNICIPALITY_WIDE" if kind == "FIXED_10_SCORING" else "",\n        })\n    for order, (cid, label) in enumerate(IN_PERSON_SPEC, 1):'
          if old not in text:
              raise SystemExit('M050 style patch anchor not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Rebuild M050 projections
        run: |
          python scripts/build_lesson_ready_m050.py
          python scripts/sync_lesson_ready_reviews.py
      - name: Commit normalized M050 style state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_lesson_ready_m050.py data/app/lesson_teaching_boxes.csv
          git commit -m 'Normalize M050 simplified-action style metadata'
          git push origin HEAD:feature/lesson-ready-15-m050
      - name: Validate full lesson and regional gates
        run: |
          set -euo pipefail
          python scripts/rebuild_lesson_ready_regional_preserve_app_ready.py
          git diff --exit-code -- data/app/lesson_teaching_boxes.csv data/master/07_implementation_priority.csv
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          python scripts/validate_company_municipality_mapping.py
          python scripts/validate_item_image_mapping_pilot.py
          node --check app/app.js
