name: TEMP M070 full pre-PR gate

on:
  push:
    branches:
      - feature/lesson-ready-15-m070
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Confirm M070 builder and review sync are idempotent
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m070.py
          git diff --exit-code -- data scripts/build_lesson_ready_m070.py scripts/validate_lesson_scoring_modes.py
          python scripts/sync_lesson_ready_reviews.py
          git diff --exit-code -- data scripts/build_lesson_ready_m070.py scripts/validate_lesson_scoring_modes.py

      - name: Validate formal and supplemental lesson item layers
        run: |
          set -euo pipefail
          python scripts/validate_lesson_item_set.py
          python scripts/build_lesson_supplemental_scoring.py
          git diff --exit-code -- data/app/lesson_supplemental_item_scoring.csv
          python scripts/validate_lesson_supplemental_scoring.py
          python scripts/red_team_lesson_supplemental_scoring.py
          python scripts/validate_lesson_15_ui.py
          python scripts/red_team_lesson_15_ui.py

      - name: Validate fixed-10 scoring and regional regressions
        run: |
          set -euo pipefail
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/validate_m106_mobile_battery_factfix.py
          python scripts/red_team_m106_mobile_battery_factfix.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          node --check app/app.js

      - name: Validate company mapping regressions
        run: |
          set -euo pipefail
          python scripts/validate_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/red_team_company_municipality_mapping.py
          node --check app/company-selector.js
          grep -q 'id="selectionModeSelect"' app/index.html
          grep -q 'id="companySelect"' app/index.html
          grep -q 'id="companySiteSelect"' app/index.html
          grep -q 'company-selector.js' app/index.html

      - name: Validate canonical, schema, assets, display, and style gates
        run: |
          set -euo pipefail
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          python scripts/validate_item_image_assets.py
          python scripts/validate_teaching_display_layer.py
          python scripts/validate_style_research_promotion_compat.py --gate

      - name: Confirm clean worktree for permanent files
        run: |
          set -euo pipefail
          git diff --exit-code -- data app scripts
