name: M106 mobile battery fact-fix

on:
  push:
    branches:
      - fix/m106-mobile-battery-hazardous
    paths:
      - scripts/fix_m106_mobile_battery_hazardous.py
      - scripts/validate_m106_mobile_battery_factfix.py
      - scripts/red_team_m106_mobile_battery_factfix.py
      - .github/workflows/m106-mobile-battery-factfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  factfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m106-mobile-battery-hazardous
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch M106 source truth and scoring invariants
        run: python scripts/fix_m106_mobile_battery_hazardous.py
      - name: Synchronize LESSON_READY canonical and image mapping
        run: python scripts/sync_lesson_ready_reviews.py
      - name: Validate M106 fact fix
        run: python scripts/validate_m106_mobile_battery_factfix.py
      - name: RED TEAM M106 fact fix
        run: python scripts/red_team_m106_mobile_battery_factfix.py
      - name: Existing lesson scoring regression
        run: |
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
      - name: Existing teaching display regression
        run: python scripts/validate_teaching_display_layer.py
      - name: Existing image mapping regression
        run: |
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
      - name: Canonical schema regression
        run: |
          python scripts/validation_v12.py
          python scripts/red_team_schema_v12.py
      - name: Commit generated M106 state
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/lesson_readiness/m106_item_review.csv \
                  data/research/05_item_mapping_master.csv \
                  data/research/07_item_mapping_coverage.csv \
                  data/app/item_image_mapping_pilot_top8.csv \
                  data/app/lesson_item_scoring_projection.csv \
                  data/app/lesson_teaching_boxes.csv \
                  data/app/lesson_mode_app_ready_scope.csv \
                  scripts/sync_lesson_ready_reviews.py \
                  scripts/validate_lesson_scoring_modes.py \
                  scripts/red_team_lesson_scoring_modes.py
          git commit -m 'Fix M106 mobile battery hazardous-waste scoring'
          git push origin HEAD:fix/m106-mobile-battery-hazardous
