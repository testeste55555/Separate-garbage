name: APP Readiness Decision Basis CI

on:
  push:
    paths:
      - 'scripts/app_readiness_evidence_policy.py'
      - 'scripts/classify_app_readiness_decision_basis.py'
      - 'scripts/red_team_app_readiness_decision_basis.py'
      - '.github/workflows/app-readiness-decision-basis-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Classify persisted evidence under new policy
        run: |
          set -euo pipefail
          python3 scripts/classify_app_readiness_decision_basis.py
          python3 scripts/red_team_app_readiness_decision_basis.py
          python3 scripts/validate_research.py
