name: Company selector CI

on:
  pull_request:
    paths:
      - "app/index.html"
      - "app/company-selector.js"
      - "data/app/company_municipality_mapping.csv"
      - "data/app/lesson_mode_app_ready_scope.csv"
      - "data/app/lesson_variant_groups.csv"
      - "data/master/01_municipalities_master.csv"
      - "scripts/validate_company_municipality_mapping.py"
      - "scripts/red_team_company_municipality_mapping.py"
      - "scripts/_repair_company_onboarding_once.py"
      - ".github/workflows/company-selector.yml"
  push:
    branches: [main, feature/company-onboarding-18]
    paths:
      - "scripts/_repair_company_onboarding_once.py"
      - ".github/workflows/company-selector.yml"

permissions:
  contents: read

jobs:
  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/company-onboarding-18'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: feature/company-onboarding-18
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Apply exact compatibility repair
        run: python scripts/_repair_company_onboarding_once.py
      - name: Verify repaired data and existing behavior
        run: |
          python scripts/validate_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_app_readiness_m098.py
          python scripts/red_team_app_readiness_m098.py
      - name: Commit permanent fixes and remove temporary helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/app/company_municipality_mapping.csv scripts/validate_app_readiness_m098.py scripts/red_team_app_readiness_m098.py scripts/validate_company_onboarding_18.py .github/workflows/company-selector.yml
          git add -u scripts/_repair_company_onboarding_once.py
          git diff --cached --check
          git commit -m 'Preserve original routing assertions and validate expanded company registry'
          git push origin HEAD:feature/company-onboarding-18

  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: "22"
      - name: Validate company mapping
        run: python scripts/validate_company_municipality_mapping.py
      - name: Mutation RED TEAM
        run: python scripts/red_team_company_municipality_mapping.py
      - name: JavaScript syntax
        run: node --check app/company-selector.js
      - name: Company selector DOM contract
        run: |
          grep -q 'id="selectionModeSelect"' app/index.html
          grep -q 'id="companySelect"' app/index.html
          grep -q 'id="companySiteSelect"' app/index.html
          grep -q 'company-selector.js' app/index.html
