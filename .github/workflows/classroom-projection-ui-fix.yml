name: Classroom projection UI fix

on:
  push:
    branches:
      - fix/all-teaching-box-colors-and-size
    paths:
      - 'scripts/apply_classroom_projection_ui_fix.py'
      - '.github/workflows/classroom-projection-ui-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply projection UI changes
        run: python3 scripts/apply_classroom_projection_ui_fix.py
      - name: Validate UI and existing resolver
        run: |
          set -euo pipefail
          node --check app/app.js
          python3 scripts/validate_lesson_box_style_resolver.py
          python3 scripts/red_team_lesson_box_style_resolver.py
          python3 scripts/validate_teaching_display_layer.py
      - name: Commit generated UI changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/app.js app/styles.css scripts/validate_lesson_box_style_resolver.py scripts/red_team_lesson_box_style_resolver.py
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git commit -m 'Enlarge and color all classroom teaching boxes'
          git push
