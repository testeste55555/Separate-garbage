name: Action pin audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: List all action references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ALL ACTION REFERENCES ==='
          grep -RhnE '^\s*-?\s*uses:\s*[^#[:space:]]+@[^#[:space:]]+' .github/workflows | sed -E 's/^.*uses:[[:space:]]*/uses: /' | sort -u || true
          echo '=== UNPINNED ACTION REFERENCES ==='
          grep -RhnE '^\s*-?\s*uses:\s*[^#[:space:]]+@[^#[:space:]]+' .github/workflows | sed -E 's/^.*uses:[[:space:]]*/uses: /' | grep -Ev '@[0-9a-fA-F]{40}([[:space:]]|$)' | sort -u || true
