name: Action pin audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - name: List all action references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ALL ACTION REFERENCES ==='
          grep -RHnE '^\s*-?\s*uses:\s*[^#[:space:]]+@[^#[:space:]]+' .github/workflows | sort || true
          echo '=== UNPINNED ACTION REFERENCES BY FILE ==='
          grep -RHnE '^\s*-?\s*uses:\s*[^#[:space:]]+@[^#[:space:]]+' .github/workflows | grep -Ev '@[0-9a-fA-F]{40}([[:space:]]|$)' | sort || true
