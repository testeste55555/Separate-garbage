name: M067 build verify

on:
  push:
    branches: [feature/lesson-ready-15-m067]
    paths:
      - ".github/workflows/m067-build-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m067
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Patch M067 scoring validator expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_lesson_scoring_modes.py')
          s=p.read_text(encoding='utf-8')
          old='"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M050": LESSON_READY, "M055": LESSON_READY, "M056": LESSON_READY, "M097": LESSON_READY,'
          new='"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M050": LESSON_READY, "M055": LESSON_READY, "M056": LESSON_READY, "M067": LESSON_READY, "M097": LESSON_READY,'
          if old not in s: raise SystemExit('regression status block not found')
          s=s.replace(old,new)
          old2='"M030": (7, 9), "M048": (5, 6), "M050": (8, 7), "M056": (8, 7),'
          new2='"M030": (7, 9), "M048": (5, 6), "M050": (8, 7), "M056": (8, 7), "M067": (5, 5),'
          if old2 not in s: raise SystemExit('box count block not found')
          s=s.replace(old2,new2)
          for token in ['"M067": LESSON_READY', '"M067": (5, 5)']:
              if token not in s: raise SystemExit(f'validator patch failed: {token}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build and normalize M067
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m067.py
          python scripts/sync_lesson_ready_reviews.py
          git add scripts/validate_lesson_scoring_modes.py \
            data/app/lesson_mode_app_ready_scope.csv \
            data/app/lesson_teaching_boxes.csv \
            data/app/lesson_item_scoring_projection.csv \
            data/app/item_image_mapping_pilot_top8.csv \
            data/app/company_municipality_mapping.csv \
            data/master/07_implementation_priority.csv \
            data/research/03_sources_master.csv \
            data/research/04_municipalities_research.csv \
            data/research/05_item_mapping_master.csv \
            data/research/06_qa_log.csv \
            data/research/07_item_mapping_coverage.csv \
            data/research/batches/batch_07/batch_07_sources.csv \
            data/research/batches/batch_07/batch_07_municipalities.csv \
            data/research/batches/batch_07/batch_07_qa.csv
          python scripts/build_lesson_ready_m067.py
          python scripts/sync_lesson_ready_reviews.py
          git diff --exit-code
      - name: Commit normalized M067 data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build M067 lesson-ready projections'
          git push origin HEAD:feature/lesson-ready-15-m067
      - name: Validate M067 and regression gates
        run: |
          set -euo pipefail
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
          python scripts/validate_company_municipality_mapping.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          node --check app/app.js
