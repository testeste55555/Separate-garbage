name: Diagnose Batch 12

on:
  push:
    paths:
      - '.github/workflows/diagnose-batch-12.yml'
      - 'scripts/build_batch_12.py'
      - 'scripts/build_batch_12_active.py'
      - 'scripts/red_team_batch_12.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture Batch 12 diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p docs/research
          {
            echo '=== py_compile ==='
            python3 -m py_compile scripts/build_batch_12.py scripts/build_batch_12_active.py scripts/red_team_batch_12.py
            echo "py_compile_rc=$?"
            echo '=== build ==='
            python3 scripts/build_batch_12_active.py
            echo "build_rc=$?"
            echo '=== structural ==='
            python3 scripts/validate_research.py --batch batch_12 --next-batch-gate
            echo "structural_rc=$?"
            echo '=== red team ==='
            python3 scripts/red_team_batch_12.py
            echo "red_team_rc=$?"
          } > docs/research/batch_12_debug.txt 2>&1
          exit 0
      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/batch_12_debug.txt
          git commit -m 'Capture Batch 12 diagnostic log'
          git push
