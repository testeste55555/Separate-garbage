name: All teaching box style audit

on:
  push:
    branches:
      - fix/all-teaching-box-colors-and-size
    paths:
      - 'scripts/audit_all_teaching_box_styles.py'
      - 'data/app/lesson_teaching_boxes.csv'
      - 'data/app/lesson_variant_teaching_boxes.csv'
      - 'data/app/lesson_variant_groups.csv'
      - 'data/app/lesson_mode_app_ready_scope.csv'
      - 'data/style_research/08_style_ui_projection.csv'
      - '.github/workflows/all-teaching-box-style-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit every current teaching box style
        run: python3 scripts/audit_all_teaching_box_styles.py
