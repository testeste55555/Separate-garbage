name: Build Batch 07

on:
  push:
    paths:
      - 'scripts/build_batch_07.py'
      - 'scripts/red_team_batch_07.py'
      - '.github/workflows/build-batch-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Batch 07 only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_batch_07.py
      - name: Commit generated research bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/02_official_domain_registry.csv data/research/batches/batch_07
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate Batch 07 research bundle'
          git push
