name: Build Batch 07

on:
  push:
    paths:
      - 'scripts/build_batch_07.py'
      - 'scripts/batch07_verified_supplement.py'
      - 'scripts/red_team_batch_07.py'
      - '.github/workflows/build-batch-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose final Batch 07 pipeline
        shell: bash
        run: |
          mkdir -p docs/research
          log=docs/research/batch_07_pipeline_probe.log
          : > "$log"
          set +e
          python3 scripts/build_batch_07.py >> "$log" 2>&1; echo "build_rc=$?" >> "$log"
          python3 scripts/validate_research.py --batch batch_07 >> "$log" 2>&1; echo "batch_validate_rc=$?" >> "$log"
          python3 scripts/merge_research.py >> "$log" 2>&1; echo "merge_rc=$?" >> "$log"
          python3 scripts/validate_research.py >> "$log" 2>&1; echo "canonical_validate_rc=$?" >> "$log"
          python3 scripts/red_team_schema_v12.py >> "$log" 2>&1; echo "schema_red_team_rc=$?" >> "$log"
          python3 scripts/red_team_operational_category_semantics.py >> "$log" 2>&1; echo "operational_red_team_rc=$?" >> "$log"
          python3 scripts/red_team_batch_07.py >> "$log" 2>&1; echo "batch07_red_team_rc=$?" >> "$log"
          python3 scripts/check_next_batch_gate.py >> "$log" 2>&1; echo "next_batch_gate_rc=$?" >> "$log"
          set -e
      - name: Commit diagnostics and generated canonical data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/02_official_domain_registry.csv data/research/batches/batch_07 data/research/02_categories_master.csv data/research/03_sources_master.csv data/research/04_municipalities_research.csv data/research/05_item_mapping_master.csv data/research/06_qa_log.csv data/research/07_item_mapping_coverage.csv data/research/08_category_review_evidence.csv docs/research/batch_07_pipeline_probe.log
          git commit -m 'Record final Batch 07 pipeline diagnostics' || exit 0
          git push
