name: Build Batch 07

on:
  push:
    paths:
      - 'scripts/build_batch_07.py'
      - 'scripts/build_batch_07_active.py'
      - 'scripts/batch07_verified_supplement.py'
      - 'scripts/red_team_batch_07.py'
      - 'data/master/05_deferred_municipalities.csv'
      - '.github/workflows/build-batch-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose Batch 08 pipeline
        shell: bash
        run: |
          mkdir -p docs/research
          log=docs/research/batch_08_pipeline_probe.log
          : > "$log"
          set +e
          python3 scripts/build_batch_08.py >> "$log" 2>&1; echo "build_rc=$?" >> "$log"
          python3 scripts/fix_batch08_authenticity.py >> "$log" 2>&1; echo "authenticity_fix_rc=$?" >> "$log"
          python3 scripts/validate_research.py --batch batch_08 >> "$log" 2>&1; echo "batch_validate_rc=$?" >> "$log"
          python3 scripts/red_team_batch_08.py >> "$log" 2>&1; echo "batch08_red_team_rc=$?" >> "$log"
          set -e
      - name: Commit Batch 08 diagnostics and generated bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/02_official_domain_registry.csv data/research/batches/batch_08 docs/research/batch_08_pipeline_probe.log || true
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
            exit 0
          fi
          git commit -m 'Record Batch 08 pipeline diagnostics'
          git push
