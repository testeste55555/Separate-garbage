name: TEMP M068 diagnose
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run builder and persist diagnostics
        shell: bash
        run: |
          set +e
          python scripts/tmp_patch_m068.py > tmp_m068_error.log 2>&1
          p=$?
          if [ $p -eq 0 ]; then
            python scripts/build_lesson_ready_m068.py >> tmp_m068_error.log 2>&1
            p=$?
          fi
          echo "exit_code=$p" >> tmp_m068_error.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_m068_error.log
          git commit -m 'Record M068 build diagnostic'
          git push origin HEAD:feature/lesson-ready-15-m068
          exit 0
