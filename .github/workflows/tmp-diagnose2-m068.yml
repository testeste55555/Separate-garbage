name: TEMP M068 diagnose artifact
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run builder diagnostic
        shell: bash
        run: |
          set +e
          python scripts/tmp_patch_m068.py > tmp_m068_error.log 2>&1
          p=$?
          if [ $p -eq 0 ]; then
            python scripts/build_lesson_ready_m068.py >> tmp_m068_error.log 2>&1
            p=$?
          fi
          echo "exit_code=$p" >> tmp_m068_error.log
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m068-diagnostic
          path: tmp_m068_error.log
