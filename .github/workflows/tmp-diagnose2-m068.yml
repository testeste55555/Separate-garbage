name: TEMP M068 diagnose artifact
on:
  push:
    branches: [feature/lesson-ready-15-m068]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m068
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run full diagnostic
        shell: bash
        run: |
          set +e
          LOG=tmp_m068_error.log
          : > "$LOG"
          run() {
            echo "===== $* =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            p=$?
            echo "exit_code=$p" >> "$LOG"
            return $p
          }
          run python scripts/tmp_fix_m068_builder.py || exit 0
          run python scripts/tmp_patch_m068.py || exit 0
          run python -m py_compile scripts/build_lesson_ready_m068.py || exit 0
          run python scripts/build_lesson_ready_m068.py || exit 0
          run python scripts/sync_lesson_ready_reviews.py || exit 0
          run python scripts/validate_lesson_item_set.py || exit 0
          run python scripts/build_lesson_supplemental_scoring.py || exit 0
          run git diff --exit-code -- data/app/lesson_supplemental_item_scoring.csv || exit 0
          run python scripts/validate_lesson_supplemental_scoring.py || exit 0
          run python scripts/red_team_lesson_supplemental_scoring.py || exit 0
          run python scripts/validate_lesson_15_ui.py || exit 0
          run python scripts/red_team_lesson_15_ui.py || exit 0
          run python scripts/validate_classroom_pilot_scoring_modes.py || exit 0
          run python scripts/red_team_classroom_pilot_scoring_modes.py || exit 0
          run python scripts/validate_classroom_pilot_variants.py || exit 0
          run python scripts/red_team_classroom_pilot_variants.py || exit 0
          run python scripts/validate_item_image_mapping_pilot.py || exit 0
          for f in scripts/red_team_item_image_mapping*.py scripts/validate_*company*.py scripts/red_team_*company*.py scripts/*company*onboarding*.py; do
            [ -e "$f" ] || continue
            run python "$f" || exit 0
          done
          run node --check app/app.js || exit 0
          run python scripts/validate_research.py || exit 0
          run python scripts/check_next_batch_gate.py || exit 0
          run python scripts/validate_item_image_assets.py || exit 0
          run python scripts/validate_teaching_display_layer.py || exit 0
          echo "ALL_DIAGNOSTIC_GATES_PASSED" >> "$LOG"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m068-diagnostic
          path: tmp_m068_error.log
