name: Lesson scoring modes

on:
  pull_request:
    paths:
      - "app/**"
      - "data/app/**"
      - "data/research/app_readiness/**"
      - "data/research/lesson_readiness/**"
      - "data/research/03_sources_master.csv"
      - "data/research/05_item_mapping_master.csv"
      - "data/research/07_item_mapping_coverage.csv"
      - "data/research/02_categories_master.csv"
      - "data/style_research/**"
      - "scripts/sync_lesson_ready_reviews.py"
      - "scripts/build_lesson_ready_m107_m109.py"
      - "scripts/build_lesson_ready_batch11.py"
      - "scripts/build_lesson_ready_regional_batch.py"
      - "scripts/rebuild_lesson_ready_regional_preserve_app_ready.py"
      - "scripts/classroom_pilot_scoring_compat.py"
      - "scripts/classroom_pilot_variant_compat.py"
      - "scripts/validate_style_research_promotion_compat.py"
      - "scripts/red_team_style_research_promotion_compat.py"
      - "scripts/validate_lesson_item_set.py"
      - "scripts/build_lesson_supplemental_scoring.py"
      - "scripts/validate_lesson_supplemental_scoring.py"
      - "scripts/red_team_lesson_supplemental_scoring.py"
      - "scripts/validate_lesson_15_ui.py"
      - "scripts/red_team_lesson_15_ui.py"
      - "scripts/validate_lesson_scoring_modes.py"
      - "scripts/red_team_lesson_scoring_modes.py"
      - "scripts/validate_classroom_pilot_scoring_modes.py"
      - "scripts/red_team_classroom_pilot_scoring_modes.py"
      - "scripts/validate_m106_mobile_battery_factfix.py"
      - "scripts/red_team_m106_mobile_battery_factfix.py"
      - "scripts/validate_lesson_variants.py"
      - "scripts/red_team_lesson_variants.py"
      - "scripts/validate_classroom_pilot_variants.py"
      - "scripts/red_team_classroom_pilot_variants.py"
      - "scripts/check_next_batch_gate.py"
      - "scripts/validate_app_ready_lesson_modes.py"
      - "scripts/red_team_app_ready_lesson_modes.py"
      - ".github/workflows/app-ready-lesson-modes.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/app/**"
      - "data/research/app_readiness/**"
      - "data/research/lesson_readiness/**"
      - "data/research/03_sources_master.csv"
      - "data/research/05_item_mapping_master.csv"
      - "data/research/07_item_mapping_coverage.csv"
      - "data/research/02_categories_master.csv"
      - "data/style_research/**"
      - "scripts/sync_lesson_ready_reviews.py"
      - "scripts/build_lesson_ready_m107_m109.py"
      - "scripts/build_lesson_ready_batch11.py"
      - "scripts/build_lesson_ready_regional_batch.py"
      - "scripts/rebuild_lesson_ready_regional_preserve_app_ready.py"
      - "scripts/classroom_pilot_scoring_compat.py"
      - "scripts/classroom_pilot_variant_compat.py"
      - "scripts/validate_style_research_promotion_compat.py"
      - "scripts/red_team_style_research_promotion_compat.py"
      - "scripts/validate_lesson_item_set.py"
      - "scripts/build_lesson_supplemental_scoring.py"
      - "scripts/validate_lesson_supplemental_scoring.py"
      - "scripts/red_team_lesson_supplemental_scoring.py"
      - "scripts/validate_lesson_15_ui.py"
      - "scripts/red_team_lesson_15_ui.py"
      - "scripts/validate_lesson_scoring_modes.py"
      - "scripts/red_team_lesson_scoring_modes.py"
      - "scripts/validate_classroom_pilot_scoring_modes.py"
      - "scripts/red_team_classroom_pilot_scoring_modes.py"
      - "scripts/validate_m106_mobile_battery_factfix.py"
      - "scripts/red_team_m106_mobile_battery_factfix.py"
      - "scripts/validate_lesson_variants.py"
      - "scripts/red_team_lesson_variants.py"
      - "scripts/validate_classroom_pilot_variants.py"
      - "scripts/red_team_classroom_pilot_variants.py"
      - "scripts/check_next_batch_gate.py"
      - "scripts/validate_app_ready_lesson_modes.py"
      - "scripts/red_team_app_ready_lesson_modes.py"
      - ".github/workflows/app-ready-lesson-modes.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate formal 15-item lesson set
        run: python scripts/validate_lesson_item_set.py
      - name: Build and validate supplemental 5 scoring
        run: |
          python scripts/build_lesson_supplemental_scoring.py
          git diff --exit-code -- data/app/lesson_supplemental_item_scoring.csv
          python scripts/validate_lesson_supplemental_scoring.py
          python scripts/red_team_lesson_supplemental_scoring.py
      - name: Validate guarded lesson 15 UI
        run: python scripts/validate_lesson_15_ui.py
      - name: RED TEAM guarded lesson 15 UI
        run: python scripts/red_team_lesson_15_ui.py
      - name: Rebuild and confirm LESSON_READY_10 projections
        run: |
          python scripts/build_lesson_ready_m107_m109.py
          python scripts/build_lesson_ready_batch11.py
          python scripts/sync_lesson_ready_reviews.py
          python scripts/rebuild_lesson_ready_regional_preserve_app_ready.py
          git diff --exit-code -- \
            data/app/lesson_mode_app_ready_scope.csv \
            data/app/lesson_teaching_boxes.csv \
            data/app/lesson_item_scoring_projection.csv \
            data/app/item_image_mapping_pilot_top8.csv \
            data/research/lesson_readiness/m107_item_review.csv \
            data/research/lesson_readiness/m108_item_review.csv \
            data/research/lesson_readiness/m109_item_review.csv \
            data/research/lesson_readiness/m110_item_review.csv \
            data/research/lesson_readiness/m111_item_review.csv \
            data/research/lesson_readiness/m112_item_review.csv \
            data/research/05_item_mapping_master.csv \
            data/research/07_item_mapping_coverage.csv \
            data/master/07_implementation_priority.csv
      - name: Validate lesson scoring modes
        run: python scripts/validate_classroom_pilot_scoring_modes.py
      - name: RED TEAM lesson scoring modes
        run: python scripts/red_team_classroom_pilot_scoring_modes.py
      - name: Validate M106 mobile battery fact fix
        run: python scripts/validate_m106_mobile_battery_factfix.py
      - name: RED TEAM M106 mobile battery fact fix
        run: python scripts/red_team_m106_mobile_battery_factfix.py
      - name: Validate regional lesson variants
        run: python scripts/validate_classroom_pilot_variants.py
      - name: RED TEAM regional lesson variants
        run: python scripts/red_team_classroom_pilot_variants.py
      - name: Check learner UI JavaScript syntax
        run: node --check app/app.js
      - name: Validate canonical research data
        run: python scripts/validate_research.py
      - name: Confirm canonical merge remains idempotent after lesson projection
        run: python scripts/check_next_batch_gate.py
      - name: Validate item image assets
        run: python scripts/validate_item_image_assets.py
      - name: Validate Teaching Display Layer
        run: python scripts/validate_teaching_display_layer.py
      - name: Validate Style Research gate
        run: python scripts/validate_style_research_promotion_compat.py --gate
