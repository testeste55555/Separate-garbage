name: M055 gate verify
on:
  push:
    branches: [feature/lesson-ready-15-m055]
    paths: ['.github/workflows/m055-gate-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m055
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild M055 and confirm idempotence
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m055.py
          git diff --exit-code -- . \
            ':(exclude).github/workflows/m055-build-normalize.yml' \
            ':(exclude).github/workflows/m055-contract-fix.yml' \
            ':(exclude).github/workflows/m055-final-verify.yml' \
            ':(exclude).github/workflows/m055-variant-diagnose.yml' \
            ':(exclude).github/workflows/m055-box-fix.yml' \
            ':(exclude).github/workflows/m055-promotion-diagnose.yml' \
            ':(exclude).github/workflows/m055-gate-verify.yml'
      - name: Validate lesson scoring and variants
        run: |
          set -euo pipefail
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
      - name: Validate routing and research
        run: |
          set -euo pipefail
          python scripts/validate_company_municipality_mapping.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
      - name: Confirm historical regional rebuild preserves M055
        run: |
          set -euo pipefail
          python scripts/rebuild_lesson_ready_regional_preserve_app_ready.py
          git diff --exit-code -- \
            data/app/district_scopes.csv \
            data/app/lesson_variant_groups.csv \
            data/app/lesson_variant_item_scoring.csv \
            data/app/lesson_variant_teaching_boxes.csv \
            data/research/lesson_readiness/lesson_variant_sources.csv \
            data/master/07_implementation_priority.csv
      - name: Validate learner JavaScript syntax
        run: node --check app/app.js
