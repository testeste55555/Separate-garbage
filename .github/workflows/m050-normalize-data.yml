name: M050 data normalize

on:
  push:
    branches:
      - feature/lesson-ready-15-m050
    paths:
      - '.github/workflows/m050-normalize-data.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m050
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch M050 scoring validator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_lesson_scoring_modes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M097": LESSON_READY,',
              '"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M050": LESSON_READY, "M097": LESSON_READY,',
          )
          text = text.replace(
              '"M030": (7, 9), "M048": (5, 6),',
              '"M030": (7, 9), "M048": (5, 6), "M050": (8, 7),',
          )
          text = text.replace(
              'expected_simplified = {("M030", "I029"), ("M107", "I007"), ("M110", "I029"), ("M111", "I029")}',
              'expected_simplified = {("M030", "I029"), ("M050", "I029"), ("M107", "I007"), ("M110", "I029"), ("M111", "I029")}',
          )
          for marker in ['"M050": LESSON_READY', '"M050": (8, 7)', '("M050", "I029")']:
              if marker not in text:
                  raise SystemExit(f'M050 validator patch failed: {marker}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build and synchronize M050
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m050.py
          python scripts/sync_lesson_ready_reviews.py
      - name: Commit normalized M050 state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_lesson_scoring_modes.py \
            data/research/02_categories_master.csv \
            data/research/03_sources_master.csv \
            data/research/05_item_mapping_master.csv \
            data/research/06_qa_log.csv \
            data/research/07_item_mapping_coverage.csv \
            data/research/batches/batch_05/batch_05_sources.csv \
            data/research/batches/batch_05/batch_05_categories.csv \
            data/research/batches/batch_05/batch_05_qa.csv \
            data/app/lesson_mode_app_ready_scope.csv \
            data/app/lesson_teaching_boxes.csv \
            data/app/lesson_item_scoring_projection.csv \
            data/app/item_image_mapping_pilot_top8.csv \
            data/app/company_municipality_mapping.csv \
            data/master/07_implementation_priority.csv
          if git diff --cached --quiet; then
            echo 'No normalized M050 changes.'
          else
            git commit -m 'Generate M050 LESSON_READY_10 state'
            git push origin HEAD:feature/lesson-ready-15-m050
          fi
      - name: Validate M050 and regressions
        run: |
          set -euo pipefail
          python scripts/validate_lesson_item_set.py
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_company_municipality_mapping.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          node --check app/app.js
