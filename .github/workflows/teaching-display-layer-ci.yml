name: Teaching display layer CI

on:
  push:
    paths:
      - "app/**"
      - "data/master/04_common_items_master.csv"
      - "data/master/06_teaching_item_group_mapping.csv"
      - "data/master/01_municipalities_master.csv"
      - "data/research/02_categories_master.csv"
      - "data/research/04_municipalities_research.csv"
      - "scripts/validate_teaching_display_layer.py"
      - ".github/workflows/teaching-display-layer-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/master/04_common_items_master.csv"
      - "data/master/06_teaching_item_group_mapping.csv"
      - "data/master/01_municipalities_master.csv"
      - "data/research/02_categories_master.csv"
      - "data/research/04_municipalities_research.csv"
      - "scripts/validate_teaching_display_layer.py"
      - ".github/workflows/teaching-display-layer-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.11"
      - name: Validate teaching and display data
        run: python scripts/validate_teaching_display_layer.py
      - name: Check learner UI JavaScript syntax
        run: node --check app/app.js
