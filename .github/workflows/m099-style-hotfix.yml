name: M099 teaching box color hotfix

on:
  push:
    paths:
      - 'scripts/apply_m099_teaching_box_styles.py'
      - 'scripts/rebuild_style_research_preserve_app_ready.py'
      - 'scripts/validate_style_research_promotion_compat.py'
      - '.github/workflows/style-research-pilot.yml'
      - '.github/workflows/m099-style-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply M099 official-derived teaching-box colors
        run: python3 scripts/apply_m099_teaching_box_styles.py
      - name: Validate style promotion and resolver
        run: |
          set -euo pipefail
          python3 scripts/validate_style_research_promotion_compat.py --gate
          python3 scripts/validate_lesson_box_style_resolver.py
          python3 scripts/red_team_lesson_box_style_resolver.py
          python3 scripts/validate_classroom_pilot_variants.py
          python3 scripts/red_team_classroom_pilot_variants.py
          python3 scripts/validate_teaching_display_layer.py
          node --check app/app.js
      - name: Commit audited M099 color projection
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/style_research/08_style_ui_projection.csv data/app/lesson_variant_teaching_boxes.csv
          if git diff --cached --quiet; then
            echo 'No M099 style data changes to commit.'
            exit 0
          fi
          git commit -m 'Apply M099 official-derived teaching box colors'
          git push
