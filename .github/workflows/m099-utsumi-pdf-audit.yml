name: M099 Utsumi 40-item PDF audit

on:
  pull_request:
    paths:
      - ".github/workflows/m099-utsumi-pdf-audit.yml"
      - "scripts/audit_m099_utsumi_guide.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract official Utsumi guide text
        run: bash scripts/audit_m099_utsumi_guide.sh
      - name: Upload extracted text
        uses: actions/upload-artifact@v4
        with:
          name: m099-utsumi-guide-text
          path: /tmp/m099-utsumi-guide.txt
