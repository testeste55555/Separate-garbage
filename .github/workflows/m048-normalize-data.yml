name: M048 data normalize

on:
  push:
    branches:
      - feature/lesson-ready-15-m048
    paths:
      - '.github/workflows/m048-normalize-data.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m048
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch M048 regression and timezone contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_lesson_scoring_modes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"M027": LESSON_READY, "M030": LESSON_READY, "M097": LESSON_READY,',
              '"M027": LESSON_READY, "M030": LESSON_READY, "M048": LESSON_READY, "M097": LESSON_READY,',
          )
          text = text.replace(
              '"M030": (7, 9),\n        "M106":',
              '"M030": (7, 9), "M048": (5, 6),\n        "M106":',
          )
          if '"M048": LESSON_READY' not in text or '"M048": (5, 6)' not in text:
              raise SystemExit('M048 validator patch failed')
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/validate_item_image_mapping_pilot.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from datetime import date\n', 'from datetime import date, datetime\nfrom zoneinfo import ZoneInfo\n')
          text = text.replace(
              'return bool(re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", value)) and date.fromisoformat(value) <= date.today()',
              'return bool(re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", value)) and date.fromisoformat(value) <= datetime.now(ZoneInfo("Asia/Tokyo")).date()',
          )
          if 'ZoneInfo("Asia/Tokyo")' not in text:
              raise SystemExit('Japan date patch failed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build and synchronize M048
        run: |
          set -euo pipefail
          python scripts/build_lesson_ready_m048.py
          python scripts/sync_lesson_ready_reviews.py
      - name: Commit normalized M048 data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate_lesson_scoring_modes.py \
            scripts/validate_item_image_mapping_pilot.py \
            data/research/03_sources_master.csv \
            data/research/05_item_mapping_master.csv \
            data/research/06_qa_log.csv \
            data/research/07_item_mapping_coverage.csv \
            data/research/batches/batch_05/batch_05_sources.csv \
            data/research/batches/batch_05/batch_05_qa.csv \
            data/app/lesson_mode_app_ready_scope.csv \
            data/app/lesson_teaching_boxes.csv \
            data/app/lesson_item_scoring_projection.csv \
            data/app/item_image_mapping_pilot_top8.csv \
            data/app/company_municipality_mapping.csv \
            data/master/07_implementation_priority.csv
          if git diff --cached --quiet; then
            echo 'No normalized M048 data changes.'
          else
            git commit -m 'Generate M048 LESSON_READY_10 state and Japan-date validation'
            git push origin HEAD:feature/lesson-ready-15-m048
          fi
      - name: Validate M048 and regressions
        run: |
          set -euo pipefail
          python scripts/validate_lesson_item_set.py
          python scripts/validate_classroom_pilot_scoring_modes.py
          python scripts/red_team_classroom_pilot_scoring_modes.py
          python scripts/validate_company_municipality_mapping.py
          python scripts/red_team_company_municipality_mapping.py
          python scripts/validate_company_onboarding_18.py
          python scripts/validate_classroom_pilot_variants.py
          python scripts/red_team_classroom_pilot_variants.py
          python scripts/validate_item_image_mapping_pilot.py
          python scripts/red_team_item_image_mapping_pilot.py
          python scripts/validate_research.py
          python scripts/check_next_batch_gate.py
          node --check app/app.js
