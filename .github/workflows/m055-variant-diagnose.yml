name: M055 variant diagnose
on:
  push:
    branches: [feature/lesson-ready-15-m055]
    paths: ['.github/workflows/m055-variant-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lesson-ready-15-m055
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate regional variants only
        run: python scripts/validate_classroom_pilot_variants.py
