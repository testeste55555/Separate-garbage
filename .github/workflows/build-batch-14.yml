name: Build Batch 14

on:
  push:
    paths:
      - 'scripts/build_batch_14.py'
      - 'scripts/build_batch_14_active.py'
      - 'scripts/red_team_batch_14.py'
      - '.github/workflows/build-batch-14.yml'
  pull_request:
    paths:
      - 'scripts/build_batch_14.py'
      - 'scripts/build_batch_14_active.py'
      - 'scripts/red_team_batch_14.py'
      - '.github/workflows/build-batch-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Build, validate and RED TEAM Batch 14
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_batch_14_active.py
          python3 scripts/validate_research.py --batch batch_14 --next-batch-gate
          python3 scripts/red_team_batch_14.py
      - name: Merge completed Batch 14 and run global gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_research.py
          python3 scripts/validate_research.py
          python3 scripts/red_team_schema_v12.py
          python3 scripts/red_team_operational_category_semantics.py
          python3 scripts/check_next_batch_gate.py
          set +e
          python3 scripts/validate_research.py --app-readiness-gate
          app_rc=$?
          set -e
          if [ "$app_rc" -ne 2 ]; then
            echo "Expected APP_READINESS_GATE HOLD; got rc=$app_rc"
            exit 1
          fi
          mkdir -p docs/research
          cat > docs/research/batch_14_ci_status.txt <<EOF
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          batch_14_active_municipalities=6
          deferred_municipalities=M136,M139
          batch_14_structural_validation=PASS
          batch_14_red_team=PASS
          canonical_merge=PASS
          canonical_structural_validation=PASS
          schema_v1_2_4_red_team=PASS
          operational_category_semantics_red_team=PASS
          next_batch_gate=PASS
          app_readiness_gate=HOLD
          EOF
      - name: Commit completed Batch 14 state
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master/02_official_domain_registry.csv data/master/05_deferred_municipalities.csv data/research/batches/batch_14 data/research/02_categories_master.csv data/research/03_sources_master.csv data/research/04_municipalities_research.csv data/research/05_item_mapping_master.csv data/research/06_qa_log.csv data/research/07_item_mapping_coverage.csv data/research/08_category_review_evidence.csv docs/research/batch_14_ci_status.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Batch 14 official research'
          git push
